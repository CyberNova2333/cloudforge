# CloudForge CI on CNB (https://cnb.cool/CyberNova2333/cloudforge): format, typecheck, build and every test, the checks
# .github/workflows/ci.yml and format.yml run on GitHub and on a CloudForge instance (which read those files instead).
# Syntax: https://docs.cnb.cool/zh/build/grammar.html
main:
  push: &ci
    - name: ci
      docker:
        image: node:22
        # Cached on the build node, copy-on-write (concurrent builds each get their own copy): on the same node the
        # install only reconciles node_modules with the lockfile. Another node starts empty.
        volumes:
          - /usr/local/share/.cache/yarn
          - ./node_modules
      stages:
        - name: install
          script: yarn install --frozen-lockfile
        - name: config
          script: cp wrangler.jsonc.ci wrangler.jsonc && cp .dev.vars.example .dev.vars
        - name: format
          script: yarn format:check
        - name: typecheck
          script: yarn typecheck
        - name: build
          script: yarn build
        - name: test
          # Six workers on the runner's 8 cores, each a workerd with its own storage (worker/vitest.config.ts).
          script: TEST_WORKERS=6 yarn test
  pull_request: *ci

# Every other branch, on push.
$:
  push: *ci
