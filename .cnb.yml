.sync-assets-licenses: &sync-assets-licenses
  name: 检查并增量同步 ASSETS_LICENSES.md（默认停用）
  image: python:3.12-bookworm
  if: '[ "${ENABLE_MANIFEST_SYNC:-false}" = "true" ]'
  script: |
    set -eu
    export MIRROR_WEB_ENDPOINT="${CNB_WEB_ENDPOINT:-}"
    export MIRROR_REPO_SLUG="${CNB_REPO_SLUG:-}"
    export MIRROR_TOKEN_USER="${CNB_TOKEN_USER_NAME:-cnb}"
    export MIRROR_TOKEN="${CNB_TOKEN:-}"
    export MIRROR_BRANCH="${CNB_BRANCH:-main}"
    export MIRROR_REF_TYPE="${CNB_REF_TYPE:-}"
    export MIRROR_COMMITTER_NAME="cnb"
    export MIRROR_COMMITTER_EMAIL="noreply""@cnb.""local"
    export MIRROR_NOREPLY_DOMAIN="cnb."
    python3 .github/scripts/sync_assets_licenses.py mirror

.check-code: &check-code
  name: 构建、类型、格式与脚本测试
  script: |
    set -eu
    corepack enable
    pnpm install --frozen-lockfile
    cp wrangler.jsonc.ci wrangler.jsonc
    cp .dev.vars.example .dev.vars
    pnpm format:check
    pnpm build
    pnpm typecheck
    pnpm notices:check
    pnpm exec vitest run --config scripts/cloudforge/vitest.config.ts
    rm -f wrangler.jsonc .dev.vars

.build-docs: &build-docs
  name: 构建并核对文档站
  script: |
    set -eu
    corepack enable
    pnpm --dir docs-site install --frozen-lockfile
    pnpm --dir docs-site run docs:build
    test -f docs-site/.vitepress/dist/index.html

$:
  web_trigger_check:
    - name: 手动构建检查（不发布）
      docker:
        image: node:22-bookworm
      lock:
        key: checks_manual
        wait: true
        cancel-in-wait: true
      stages:
        - *check-code
        - *build-docs

  web_trigger_assets_licenses:
    - name: 手动校验并增量同步 ASSETS_LICENSES.md
      docker:
        image: python:3.12-bookworm
      env:
        ENABLE_MANIFEST_SYNC: 'true'
      lock:
        key: assets_licenses_manual
        wait: true
        cancel-in-wait: true
      stages:
        - *sync-assets-licenses
