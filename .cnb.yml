# CloudForge 在 CNB 上的持续集成：https://cnb.cool/CyberNova2333/cloudforge
# 依次检查代码格式、类型、构建和全部测试；GitHub 与 CloudForge 实例使用
# .github/workflows/ci.yml 和 format.yml 执行相应检查。
# 配置语法：https://docs.cnb.cool/zh/build/grammar.html
main:
  push: &ci
    - name: 持续集成
      docker:
        # Pinned by digest: the tag alone can change under a build.
        image: node:22@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
        # 依赖缓存在构建节点上（copy-on-write，并发构建各用一份副本）：落到同一节点时，安装只需按
        # lockfile 校正 node_modules；换了节点则从空开始。
        volumes:
          - /usr/local/share/.cache/yarn
          - ./node_modules
      stages:
        - name: 安装依赖
          script: yarn install --frozen-lockfile
        - name: 准备验证配置
          script: cp wrangler.jsonc.ci wrangler.jsonc && cp .dev.vars.example .dev.vars
        - name: 检查代码格式
          script: yarn format:check
        - name: 检查类型
          script: yarn typecheck
        - name: 构建项目
          script: yarn build
        - name: 运行全部测试
          # 8 核 runner 上开 6 个 worker，每个是独立的 workerd、有自己的存储（见 worker/vitest.config.ts）。
          script: TEST_WORKERS=6 yarn test
  pull_request: *ci

# 其他分支推送时复用同一流水线。
$:
  push: *ci
