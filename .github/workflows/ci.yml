# Modified by CyberNova for the CloudForge fork (forked 2026-10-22). Originally Apache-2.0 (see LICENSES/Apache-2.0.txt).
# Verification only — this workflow never deploys. Humans deploy.
# Formatting is checked in format.yml. On CNB, .cnb.yml runs the same checks in one pipeline.
#
# build installs, builds, and typechecks once, and caches node_modules and dist/ by commit for the
# test jobs. On CloudForge, gate asks cloudforge/relevance@v1 (docs/ci-relevance.md) which modules a
# change can affect; on GitHub it is skipped and every module runs. Each module job (test-<module>)
# restores the build and runs its own test files. Modules are few and balanced by runtime: each job
# pays for restoring the build and starting vitest, so fewer, larger jobs finish sooner.
#
# build and the test jobs run on cloudforge-standard-4 on CloudForge (runs-on is an expression; the
# label means nothing on GitHub, which gets ubuntu-latest).
#
# Every test file belongs to exactly one module. Adding a test file? Add it to its module's
# `yarn test` line below; worker/src/__tests__/platform/ci-workflow.test.ts (run by build) fails otherwise.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'cloudforge-standard-4' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      # Saved after the job succeeds (a Post step), for this commit's test jobs.
      - name: Cache the build for this commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            dist
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # wrangler.jsonc is gitignored (per-deployer IDs); CI builds from placeholders.
      - name: Stage wrangler.jsonc from CI config
        run: cp wrangler.jsonc.ci wrangler.jsonc

      # .dev.vars is gitignored; the example holds dev-only placeholder secrets.
      - name: Stage .dev.vars from example
        run: cp .dev.vars.example .dev.vars

      # vitest-pool-workers needs assets.directory (dist/client) to exist; the build produces it.
      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      # The list is built from this install and this build, so a dependency bump that ships a new
      # package shows up here instead of in a release.
      - name: Check third-party notices are current
        run: yarn notices:check

      # Here, not in a module: the gate must never skip the check that every test file runs somewhere.
      - name: Check every test file is in a module
        run: yarn test worker/src/__tests__/platform/ci-workflow.test.ts

  gate:
    name: Relevance
    # cloudforge/ actions exist only on CloudForge; on GitHub this job is skipped and every module runs.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-stacking: ${{ steps.relevance.outputs.run-stacking }}
      run-review: ${{ steps.relevance.outputs.run-review }}
      run-actions: ${{ steps.relevance.outputs.run-actions }}
      run-core: ${{ steps.relevance.outputs.run-core }}
    steps:
      - id: relevance
        uses: cloudforge/relevance@v1
        with:
          skip-below: 0.2
          # Shared test setup and the schema every test runs against (added to the defaults).
          always-run-paths: |
            scripts/testing/test-reporter.ts
            scripts/testing/test-workers.mjs
            scripts/database/generate-db.mjs
            scripts/cloudforge/recovery/reset-mfa.ts
            worker/src/__tests__/helpers/**
            worker/test/**
            worker/src/db/**
            migrations/**
          modules: |
            stacking: Stacked pull requests: stack discovery and pair edges, the stack tree, reconcile and retargeting, stack gates on landing, and land targets (worker/src/stack/, pull_requests.land_target)
            review: Reviewing and merging pull requests: reviews by reviewer agents (worker/src/review/: per-file one-liners, the Clef trigger, agent reviews and their findings (single pass, and engine: pi reviews in the AgentReviewer Durable Object with its read-only checkout), the review gate and person approvals, .orangeignore, auto-merge), the Approvals inbox, pull request states (worker/src/pulls/: state reasons, signals, settle, pr_events), merging and landing (worker/src/merge/, landPull), the merge queue and pausing merging (worker/src/merge/queue.ts), reverting a merged pull request (worker/src/pulls/revert.ts), three-way tree merges and diff3 conflicts (worker/src/git/service.ts), AI conflict resolution (MergeResolver, MERGE_RESOLUTION attempts and sweeps), generated-file matching, and agent runs (worker/src/agent-runs/: how the review, conflict resolution, sweep, and stack discovery Workflows record their steps, decisions, and AI usage, and agent run retention), agents learning from dismissed change requests (worker/src/learn/: lessons, the learn mode of AgentReviewer, validating and committing the learned edit)
            actions: CloudForge Actions (worker/src/actions/: workflow syntax and expressions, triggers, job planning and runner sizes, the executor and JobRunner containers, the job queue, the cache, log retention, the cloudforge/relevance action), the Cron Triggers (worker/src/cron.ts), and git transport and storage: the git smart-HTTP endpoint (worker/src/git/http/handler.ts), git objects, packfiles and pkt-lines (worker/src/git/), Git LFS (worker/src/lfs/http/handler.ts, worker/src/lfs/storage.ts), and raw file serving
            core: The API outside the modules above (worker/src/auth/, worker/src/access/, worker/src/instance/, worker/src/members/, worker/src/repositories/, worker/src/http/, worker/src/shared/, worker/src/index.ts): repositories, pull requests and issues (worker/src/issues/service.ts, worker/src/issues/links.ts), notifications (worker/src/notifications/service.ts, worker/src/notifications/email-delivery.ts, worker/src/notifications/mentions.ts), access and visibility (worker/src/repositories/service.ts), setup and invitations, teams, Site admin and instance settings, the audit log (worker/src/audit/service.ts), branches and the branch map (worker/src/repositories/branches.ts), coding sessions (worker/src/pulls/sessions.ts), repository health (worker/src/repositories/health.ts), the Live page payload (worker/src/live/feed.ts), global search (worker/src/search/service.ts), reviewer agent presets (worker/src/agents/presets.ts), commit emails and attribution, live updates (worker/src/live/), usage and cost (worker/src/usage/), insights, the AI Gateway, API smoke tests; the MCP server (worker/src/mcp/: JSON-RPC tools) and its OAuth sign-in (better-auth OAuth provider, JWT access tokens, consent); and the web app's client-side libraries in src/lib (agent prompts, syntax highlighting, repository URLs, the stack tree and pull request state display)

  test-stacking:
    name: Test (stacking)
    needs: [build, gate]
    if: always() && needs.build.result == 'success' && (needs.gate.result == 'skipped' || needs.gate.outputs.run-stacking == 'true')
