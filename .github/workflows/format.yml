# Modified by CyberNova for the CloudForge fork (forked 2026-10-22). Originally Apache-2.0 (see LICENSES/Apache-2.0.txt).
name: Format

on:
  push:
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Only Prettier, not the whole dependency tree: the exact version pnpm-lock.yaml pins, so the
      # check matches `yarn format` locally.
      - name: Install Prettier
        run: |
          version=$(awk '/^prettier@/ { getline; gsub(/"/, "", $2); print $2; exit }' pnpm-lock.yaml)
          yarn global add "prettier@$version" --silent
          yarn global bin >> "$GITHUB_PATH"
      - run: prettier --check .
