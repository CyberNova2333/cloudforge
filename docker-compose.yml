# Modified by CyberNova for the CloudForge fork (forked 2026-10-22). Originally Apache-2.0 (see LICENSES/Apache-2.0.txt).
services:
  cloudforge:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /work
    volumes:
      - .:/work
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      CLOUDFORGE_BUILD_CONFIG: "wrangler.test.jsonc"
    command: ["node", "scripts/visual-server.mjs"]
    expose:
      - "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - cloudforge-net

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /work
    volumes:
      - .:/work
    environment:
      BASE_URL: "http://cloudforge:8080"
      CI: "1"
    depends_on:
      cloudforge:
        condition: service_healthy
    networks:
      - cloudforge-net

networks:
  cloudforge-net:
    driver: bridge
