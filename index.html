<!doctype html>
<!-- Modified by CyberNova for the CloudForge fork (forked 2026-10-22). Originally Apache-2.0 (see LICENSES/Apache-2.0.txt). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>CloudForge</title>
    <script>
      // Applies the stored theme before the first paint, so there is no flash. Mirrors rootAttributes in
      // src/lib/theme.ts (keys go-theme-id and go-mode); ThemeProvider keeps it applied afterwards.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('go-theme-id');
          localStorage.removeItem('go-mode');
        } catch (e) {}
        root.setAttribute('data-skin', theme === 'github' ? 'dev' : 'hq');
        root.setAttribute('data-color-mode', 'auto');
        root.setAttribute('data-light-theme', 'light');
        root.setAttribute('data-dark-theme', 'dark');
        root.removeAttribute('data-theme');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
