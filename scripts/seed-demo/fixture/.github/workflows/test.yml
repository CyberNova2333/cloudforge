name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Install dependencies
        # The generated demo has no lockfile until its first install.
        run: pnpm install --no-frozen-lockfile

      - name: Run the tests
        run: pnpm test
